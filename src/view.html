<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Agent Bugcard · A private log to a GitHub issue</title>
<meta name="description" content="Turn local Claude Code and Codex CLI tool failures into a small GitHub issue attachment. Review the calls and optional exit codes before copying.">
<style>
:root{color-scheme:light;--paper:#f7f6ef;--panel:#fffef9;--ink:#1b3026;--green:#275c40;--muted:#43564c;--rule:#c5cbbf;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","PingFang TC","Microsoft YaHei","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:0 28px}.top{height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}.brand{display:flex;gap:9px;align-items:center;font-weight:720}.mark{padding:3px 7px;background:var(--ink);color:#ddedab;border-radius:5px;font:700 18px var(--mono)}a{color:var(--green);text-underline-offset:3px}.top a{font-size:14px}
.intro{margin:32px 0 20px}.intro h1{margin:0 0 9px;font-size:clamp(31px,4.3vw,53px);letter-spacing:-.05em;line-height:1.05}.intro p{font-size:17px;line-height:1.5;margin:0;max-width:790px;color:var(--muted)}.toolbar,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:5px}.finder{border:0;padding:4px 0 12px}.finder summary{color:var(--green);font-size:13px}.actions{margin:15px 0 6px}
button,.file{border:1px solid #98a99a;border-radius:7px;padding:9px 12px;background:var(--panel);color:var(--ink);cursor:pointer;line-height:1.25;font-family:inherit;font-size:14px;font-weight:650}
button:hover,.file:hover{background:#e4ebdf}button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,.file:focus-within{outline:3px solid #398660;outline-offset:3px}
[aria-pressed=true]{background:#e1ead7;border-color:var(--green)}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(240px,.85fr);gap:20px;align-items:start}.receipt{background:#20372e;color:#f3f1e9;border-radius:12px;padding:21px 24px}.receipt h2{margin:13px 0 7px;font-size:clamp(21px,2.5vw,31px);line-height:1.16;letter-spacing:-.035em}.receipt .eyebrow{display:flex;justify-content:space-between;gap:8px;color:#d1ddb9;font:600 12px/1.4 var(--mono)}.receipt p{line-height:1.45;margin:7px 0}.tip{color:#ddedab;font-weight:600}.stats,.legend{color:#c1cfc6}.legend{font-size:13px}.receipt table{border-collapse:collapse;width:100%;margin:13px 0 9px;text-align:left;font-size:15px}.receipt th{color:#c1cfc6;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid #506458;padding:10px 6px 6px}.receipt td{padding:6px}.receipt tr.focus{background:#4a4438;color:#ffd1aa}.receipt td:first-child{font-family:var(--mono)}.settings{background:var(--panel);border:1px solid var(--rule);padding:20px;border-radius:12px}.settings h2{font-size:17px;margin:0 0 13px}.opt{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.5;margin:8px 0}input{accent-color:var(--green)}select{max-width:100%;color:var(--ink);padding:5px}.muted,details p{font-size:13px;line-height:1.55;color:var(--muted)}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.primary:hover{background:var(--green)}details{border-top:1px solid var(--rule);padding:11px 0}summary{font-size:14px;font-weight:620;cursor:pointer}pre,textarea{font:13px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}.settings pre{color:var(--muted);margin-bottom:0}textarea{width:100%;height:15em;background:var(--panel);color:var(--ink);padding:10px}#notice,#feedback{font-size:13px;line-height:1.5;margin:6px 0;color:var(--muted)}[hidden]{display:none!important}footer{margin:27px 0;border-top:1px solid var(--rule);padding:14px 0;color:var(--muted);font-size:13px}
@media(max-width:740px){.wrap{padding:0 16px}.top{height:49px}.intro{margin:20px 0 14px}.intro p{font-size:15px}.grid{grid-template-columns:1fr;gap:14px}.receipt,.settings{padding:15px}.receipt table{font-size:14px}.toolbar{gap:5px}.toolbar button,.toolbar .file{padding:8px;font-size:13px}.actions button{font-size:13px}.settings{margin-top:2px}}
.nav{display:flex;gap:16px;align-items:center}.nav select{min-height:32px}.locale-label{display:flex;align-items:center;gap:8px}.finder code{display:inline-block;max-width:100%;overflow-wrap:anywhere}.lang-field{margin:0 0 13px}.lang-field select{width:100%;margin-top:4px}.actions button{min-height:40px}.receipt p:empty{display:none}:lang(zh) .intro h1,:lang(zh) .receipt h2{letter-spacing:0;line-height:1.25}:lang(zh) .intro p{line-height:1.65}.receipt{min-width:0}.receipt td,.receipt th{overflow-wrap:anywhere}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}footer p{margin:6px 0}
@media(max-width:420px){.nav{gap:8px}.nav a{font-size:12px}.nav select{font-size:14px}.wrap{padding:0 12px}.receipt table{font-size:13px}.brand{font-size:15px;gap:5px}.actions{gap:6px}.intro{margin-top:17px}}
.link-button{background:none;border:0;padding:0;color:var(--green);font:inherit;text-decoration:underline;text-underline-offset:3px}.link-button:hover{background:none}@media(max-width:740px){.issue.example-mode{display:flex;flex-direction:column}.example-mode>.main-actions{order:-2;margin:0 0 9px}.example-mode>#feedback{order:-1}.main-actions button{min-height:40px}:lang(zh) .main-actions #copyText{order:-1;background:var(--ink);color:white;border-color:var(--ink)}:lang(zh) .main-actions #copy{background:var(--panel);color:var(--ink)}.nav a,.brand{white-space:nowrap}}
@media(max-width:359px){.top .mark{display:none}.nav{gap:6px}.intro h1{font-size:28px}.main-actions button{padding:7px;font-size:12px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">::</span> Agent Bugcard</div><nav class="nav"><label class="locale-label"><span data-t="language" class="sr"></span><select id="uiLang" aria-label="Language / 语言 / 語言"><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></label><a href="https://github.com/vighzhen/agent-bugcard" rel="noreferrer" data-t="repo"></a></nav></header>
<main><div class="intro"><h1 data-t="hero"></h1><p data-t="intro"></p></div>
<div class="toolbar" data-label="choose"><label class="file"><span data-t="file"></span><input type="file" id="file" data-label="file" accept=".jsonl,.ndjson,.json"></label><button id="claude" data-t="claude"></button><button id="codex" data-t="codex"></button></div>
<details class="finder"><summary data-t="finder"></summary><p data-t="findSize"></p><p>Claude Code &nbsp;<code>~/.claude/projects/</code><br>Codex CLI &nbsp;<code>~/.codex/sessions/</code></p><p data-t="windows"></p><p><code>%USERPROFILE%\.claude\projects</code><br><code>%USERPROFILE%\.codex\sessions</code></p><p data-t="custom"></p></details>
<div class="grid"><section class="issue" data-label="attachment">
<div class="receipt" id="card" aria-live="polite"><div class="eyebrow"><span id="source"></span><span id="format"></span></div><h2 id="headline"></h2><p id="tip" class="tip"></p><p id="stats" class="stats"></p><table id="timeline"><thead><tr><th id="callHead"></th><th id="categoryHead"></th><th id="outcomeHead"></th></tr></thead><tbody id="rows"></tbody></table><p class="legend" id="legend"></p></div>
<div class="actions main-actions"><button id="copy" class="primary" data-t="copyMd"></button><button id="copyText" data-t="copyText"></button><button id="savePng" data-t="savePng"></button></div><div id="feedback" role="status"></div><details id="moreFiles"><summary data-t="more"></summary><div class="actions"><button id="saveSvg" data-t="saveSvg"></button><button id="saveMd" data-t="saveMd"></button></div></details>
<details id="exact"><summary id="previewLabel"></summary><textarea id="md" readonly></textarea></details></section>
<aside class="settings"><h2 data-t="options"></h2><label class="lang-field"><span data-t="outputLanguage"></span><select id="cardLang"><option value="auto" data-t="follow"></option><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></label>
<label class="opt" id="focusOpt" hidden><span data-t="focus"></span><select id="focus" data-label="focus"></select></label>
<label class="opt"><input id="nearby" type="checkbox" checked><span data-t="nearby"></span></label><label class="opt"><input id="categories" type="checkbox" checked><span data-t="categories"></span></label><label class="opt"><input id="exitCodes" type="checkbox"><span data-t="codes"></span></label><p id="scope" class="muted"></p><p id="notice" role="status"></p>
<details id="demoInput"><summary data-t="sampleInput"></summary><pre id="sampleText"></pre></details>
<details><summary data-t="privacy"></summary><p data-t="privacyText"></p></details></aside></div></main>
<footer><p><span data-t="footer"></span> · <button type="button" class="link-button" id="offline" data-t="offline"></button> · <a href="https://github.com/vighzhen/agent-bugcard/releases/latest/download/agent-bugcard-offline.zip" rel="noreferrer" data-t="offlineZip"></a></p><p data-t="offlineHelp"></p></footer>
<noscript>请启用 JavaScript，或使用命令行工具。請啟用 JavaScript，或使用命令列工具。Enable JavaScript or use the CLI.</noscript>
</div><script id="offline-layout" type="application/json">/*INSERT_LAYOUT*/</script><script id="app-source">/*INSERT_SCRIPT*/</script></body></html>
