name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build && git diff --exit-code -- docs
      - name: 校验离线包完整内容
        run: |
          python3 -m unittest discover -s tests -p 'test_pack_offline.py'
          python3 scripts/pack-offline.py --check docs/agent-bugcard-offline.zip
