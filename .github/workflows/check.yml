name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build && git diff --exit-code -- docs
      - name: Verify the offline ZIP contains this build
        run: python3 -c "from pathlib import Path; from zipfile import ZipFile; assert ZipFile('docs/agent-bugcard-offline.zip').read('agent-bugcard.html') == Path('docs/index.html').read_bytes()"
