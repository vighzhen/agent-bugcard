<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hans" viewBox="0 0 720 426" width="720" height="426" role="img"><title>Claude Code 工具调用诊断卡</title><rect width="720" height="426" rx="13" fill="#20372e"/><text x="26" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ddedab">Agent Bugcard</text><text x="543" y="33" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#c1cfc6">Claude Code</text><path d="M26 49H694" stroke="#4b6056"/><text x="26" y="87" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#f3f1e9">第 3 次调用  /  命令行  /  报错（退出码 127）</text><text x="26" y="119" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#ddedab">若使用 POSIX shell，先确认能否在 PATH 中找到这条命令。</text><text x="26" y="152" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#c1cfc6">5 次调用 · 1 次报错 · 0 次未配对</text><path d="M26 171H694" stroke="#4b6056"/><text x="32" y="195" font-family="monospace" font-size="12" font-weight="650" fill="#c1cfc6">调用</text><text x="138" y="195" font-family="monospace" font-size="12" font-weight="650" fill="#c1cfc6">类别</text><text x="449" y="195" font-family="monospace" font-size="12" font-weight="650" fill="#c1cfc6">状态</text><text x="32" y="229" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#1</text><text x="138" y="229" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">读取</text><text x="449" y="229" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已返回</text><text x="32" y="263" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#2</text><text x="138" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">编辑</text><text x="449" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已返回</text><rect x="18" y="274" width="684" height="31" rx="5" fill="#4a4438"/><text x="32" y="297" font-family="monospace" font-size="17" font-weight="600" fill="#ffbd98">#3</text><text x="138" y="297" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">命令行</text><text x="449" y="297" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#ffbd98">报错（退出码 127）</text><text x="32" y="331" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#4</text><text x="138" y="331" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">编辑</text><text x="449" y="331" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已返回</text><text x="32" y="365" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#5</text><text x="138" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">命令行</text><text x="449" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已返回</text><path d="M26 383H694" stroke="#4b6056"/><text x="26" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#c1cfc6">“已返回”表示工具给出了响应，执行结果仍需确认。</text><text x="535" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#c1cfc6">虚构示例</text></svg>
