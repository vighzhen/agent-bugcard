<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hant" viewBox="0 0 720 426" width="720" height="426" role="img"><title>Claude Code 工具呼叫診斷卡</title><rect width="720" height="426" rx="13" fill="#20372e"/><text x="26" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ddedab">Agent Bugcard</text><text x="543" y="33" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#c1cfc6">Claude Code</text><path d="M26 49H694" stroke="#4b6056"/><text x="26" y="87" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#f3f1e9">第 3 次呼叫  /  命令列  /  錯誤（結束碼 127）</text><text x="26" y="119" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#ddedab">若使用 POSIX shell，先確認能否在 PATH 中找到這個指令。</text><text x="26" y="152" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#c1cfc6">5 次呼叫 · 1 次錯誤 · 0 次未配對</text><path d="M26 171H694" stroke="#4b6056"/><text x="32" y="195" font-family="monospace" font-size="12" font-weight="650" fill="#c1cfc6">呼叫</text><text x="138" y="195" font-family="monospace" font-size="12" font-weight="650" fill="#c1cfc6">類別</text><text x="449" y="195" font-family="monospace" font-size="12" font-weight="650" fill="#c1cfc6">狀態</text><text x="32" y="229" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#1</text><text x="138" y="229" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">讀取</text><text x="449" y="229" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已傳回</text><text x="32" y="263" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#2</text><text x="138" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">編輯</text><text x="449" y="263" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已傳回</text><rect x="18" y="274" width="684" height="31" rx="5" fill="#4a4438"/><text x="32" y="297" font-family="monospace" font-size="17" font-weight="600" fill="#ffbd98">#3</text><text x="138" y="297" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">命令列</text><text x="449" y="297" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#ffbd98">錯誤（結束碼 127）</text><text x="32" y="331" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#4</text><text x="138" y="331" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">編輯</text><text x="449" y="331" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已傳回</text><text x="32" y="365" font-family="monospace" font-size="17" font-weight="600" fill="#c1cfc6">#5</text><text x="138" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#f3f1e9">命令列</text><text x="449" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#c1cfc6">已傳回</text><path d="M26 383H694" stroke="#4b6056"/><text x="26" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#c1cfc6">「已傳回」表示工具已回應，執行結果仍需確認。</text><text x="535" y="408" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#c1cfc6">虛構範例</text></svg>
